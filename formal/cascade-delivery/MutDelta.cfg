\* expect: violated PersistentReserved
\* module: CascadeDelivery
\* Mutant (pre-#4487): an error listed on the previous run is hidden by the
\* rolling delta (integration.ts cascade delta). A persistent error vanishes on
\* the second turn.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 3
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "rolling"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "read"
    OutsidePhases = {"start"}
    OutsideKinds = {"write"}
SPECIFICATION Spec
INVARIANTS TypeOK PersistentReserved
CHECK_DEADLOCK FALSE
