\* expect: pass
\* module: CascadeDelivery
\* Merged's fix values (#4485, #4486, #4487, #4495 round 3) over two turns,
\* with outside writes and deletes both between turns and between the
\* compute's read and turn_end (the round-2 verify's R2-1 timing). Two turns
\* are the record's whole life: delivered at the first turn_end, judged at
\* the second. Merged keeps three turns with between-turn writes only, which
\* keeps its state space inside the CI shard budget.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 2
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "read"
    OutsidePhases = {"start", "computed"}
    OutsideKinds = {"write", "delete"}
SPECIFICATION Spec
INVARIANTS TypeOK NoCleanWithoutFreshObs NoErrWithoutFreshObs PersistentReserved TouchEndsWithinBound AnswerWhenAskable ExpiryKeepsAnswer NoUnresolvedAfterChange NoSilentForget
CHECK_DEADLOCK FALSE
