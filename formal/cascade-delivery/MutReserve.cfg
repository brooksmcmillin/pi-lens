\* expect: violated PersistentReserved
\* module: CascadeDelivery
\* Mutant (pre-#4487): no pending record. A turn whose run is superseded or
\* leaves the neighbour unanswered shows nothing for an error delivered earlier.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 3
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "none"
    PendingGate = "notify"
    CheckStamp = "read"
    OutsidePhases = {"start"}
    OutsideKinds = {"write"}
SPECIFICATION Spec
INVARIANTS TypeOK PersistentReserved
CHECK_DEADLOCK FALSE
