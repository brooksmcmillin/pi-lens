\* expect: violated NoUnresolvedAfterChange
\* module: CascadeDelivery
\* Mutant (#4495 round 2, verify R2-1): the record is stamped at turn_end's
\* delivery, not at the run's read. A neighbour written outside pi between
\* the compute's read and turn_end passes the gate as unchanged and keeps
\* its "unresolved" line.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 2
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "delivery"
    OutsidePhases = {"start", "computed"}
    OutsideKinds = {"write", "delete"}
SPECIFICATION Spec
INVARIANTS TypeOK NoUnresolvedAfterChange
CHECK_DEADLOCK FALSE
