\* expect: violated ExpiryKeepsAnswer
\* module: CascadeDelivery
\* Mutant (pre-#4485): turn_end does not peek the registry and an expiring touch
\* is dropped unread (cascade-tier.ts prune). A late answer is lost.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 3
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = FALSE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "drop"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "read"
    OutsidePhases = {"start"}
    OutsideKinds = {"write"}
SPECIFICATION Spec
INVARIANTS TypeOK ExpiryKeepsAnswer
CHECK_DEADLOCK FALSE
