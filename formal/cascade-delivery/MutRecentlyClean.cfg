\* expect: violated NoCleanWithoutFreshObs
\* module: CascadeDelivery
\* Mutant (pre-#4485): a neighbour confirmed clean is skipped by later runs
\* (the recently-clean cache in integration.ts). The edit that breaks it reads
\* clean.
CONSTANTS
    Neighbours = {"n1", "n2"}
    Models = {"Pull", "CmdPull", "Always", "Silent"}
    MaxTurns = 3
    Expiry = 1
    QuietFires = TRUE
    TierPath = "inLane"
    PassiveGate = "afterEdit"
    FallbackGate = "afterEdit"
    RecentlyClean = TRUE
    Delta = "none"
    UnconfirmedMarker = "marked"
    ExpiryRead = "peekLog"
    Reserve = "record"
    PendingGate = "notify"
    CheckStamp = "read"
    OutsidePhases = {"start"}
    OutsideKinds = {"write"}
SPECIFICATION Spec
INVARIANTS TypeOK NoCleanWithoutFreshObs
CHECK_DEADLOCK FALSE
