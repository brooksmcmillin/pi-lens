\* expect: violated NoPhantomFinding
\* module: DependencyAnswer
\* Residual (cell 5): DependencyResend for a version-less server (typescript-language-server). An answer computed before z.ts's change that is still in flight when the re-send clears a.ts's cache is stored after the clear, and nothing can drop it.
CONSTANTS
    PendingGuard = TRUE
    Republish = FALSE
    MaxPubs = 3
    MaxClears = 1
    Resend = TRUE
    Versioned = FALSE
    Drain = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer NoDroppedAnswer NoCanceledStored
CHECK_DEADLOCK FALSE
