\* expect: violated NoDroppedAnswer
\* module: DependencyAnswer
\* The hand mutant for the no-drop property: the quiet window fires on a stored answer with no later receipt pending and returns to listening instead of settling. Nothing is cleared and nothing is wrong with the answer, yet the wait can only end by its deadline. SettleNeedsAnswer cannot see this: a wait that never settles never breaks it.
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "dropAnswer"
SPECIFICATION Spec
INVARIANTS NoDroppedAnswer
CHECK_DEADLOCK FALSE
