\* expect: pass
\* module: DependencyAnswer
\* The fix (#4782): a stored answer settles nothing while a later receipt is pending, so after an ordered drain from a server that republishes the dependent as it reads the dependency, the dispatch reads the answer computed against the dependency's new bytes. A clear of the path (workspace/diagnostic/refresh, a later didChange) may land while the wait is open: the quiet window then keeps waiting instead of settling on the emptied cache (#4785 F4).
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer NoDroppedAnswer NoCanceledStored
CHECK_DEADLOCK FALSE
