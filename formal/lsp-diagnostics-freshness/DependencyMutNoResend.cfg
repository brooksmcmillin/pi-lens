\* expect: violated NoPhantomFinding
\* module: DependencyAnswer
\* DependencyResend without the re-send (the #4782 phantom on master, undrained): a.ts's answer computed before z.ts's change is the newest one at the read, and its version did not move, so the version check cannot drop it.
CONSTANTS
    PendingGuard = TRUE
    Republish = FALSE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = TRUE
    Drain = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer NoDroppedAnswer NoCanceledStored
CHECK_DEADLOCK FALSE
