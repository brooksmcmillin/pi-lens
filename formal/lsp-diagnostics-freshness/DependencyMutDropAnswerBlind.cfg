\* expect: pass
\* module: DependencyAnswer
\* Blindness ratchet for DependencyMutDropAnswer: the same mutant checked with only the invariants that existed before NoDroppedAnswer passes. A window that rejects the only stored answer never settles, so NewestAtSettle, NoPhantomFinding and SettleNeedsAnswer all hold. If this config reds, one of them has grown to see the drop and NoDroppedAnswer is no longer the property that catches it.
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "dropAnswer"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer
CHECK_DEADLOCK FALSE
