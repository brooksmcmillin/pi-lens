\* expect: violated NoPhantomFinding
\* module: DependencyAnswer
\* Residual: a server that answers the drain request before it republishes the dependent (an asynchronous re-check) leaves the pre-dependency answer as the newest one; no publication names the dependency's version, so no client-side read can tell.
CONSTANTS
    PendingGuard = TRUE
    Republish = FALSE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer NoDroppedAnswer NoCanceledStored
CHECK_DEADLOCK FALSE
