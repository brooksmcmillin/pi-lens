\* expect: violated NoDroppedAnswer
\* module: DependencyAnswer
\* A second, independent witness that NoDroppedAnswer observes a real outcome: the answer guard widened so it also refuses a stored answer (`AnswerGuarded /\ ~cache.has` becomes `AnswerGuarded`). The quiet window then goes back to listening on the only stored answer, the same outcome as DependencyMutDropAnswer by a different edit. The three invariants that predate NoDroppedAnswer pass this mutant (DependencyMutDropAnswerBlind shows it for the identical state graph).
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "widenAnswerGuard"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer NoDroppedAnswer NoCanceledStored
CHECK_DEADLOCK FALSE
