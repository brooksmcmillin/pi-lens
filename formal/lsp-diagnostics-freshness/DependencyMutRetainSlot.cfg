\* expect: violated NoCanceledStored
\* module: DependencyAnswer
\* The hand mutant for the cancel in Clear (#4785 F1): Clear empties the cache but leaves the receipt in the quiet-window slot, so the slot's timer stores an answer the clear canceled (the pre-dependency STOP, receive order 0). The ghost `canceled` names the receipt the clear took; NoCanceledStored says the cache never holds it.
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "retainSlot"
SPECIFICATION Spec
INVARIANTS NoCanceledStored
CHECK_DEADLOCK FALSE
