\* expect: pass
\* module: DependencyAnswer
\* Vacuity ratchet for DependencyMutAnswerGuard: the same mutant with no clear action (MaxClears = 0, the model before #4785 F4's follow-up) passes SettleNeedsAnswer, because nothing ever empties the cache after a store. The invariant only has force once a clear can land; if this config turns red, the clear action no longer reaches the guard and the mutant config above is checking nothing.
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 0
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "noAnswerGuard"
SPECIFICATION Spec
INVARIANTS SettleNeedsAnswer
CHECK_DEADLOCK FALSE
