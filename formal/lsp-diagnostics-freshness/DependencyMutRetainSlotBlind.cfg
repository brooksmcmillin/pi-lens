\* expect: pass
\* module: DependencyAnswer
\* Blindness ratchet for DependencyMutRetainSlot: the same mutant checked with the four invariants that existed before NoCanceledStored passes. The canceled receipt is a valid answer for the content it was computed for, so no settle or freshness rule is broken by storing it. If this config reds, an older invariant now sees the retained receipt and NoCanceledStored is no longer the property that catches it.
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "retainSlot"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer NoDroppedAnswer
CHECK_DEADLOCK FALSE
