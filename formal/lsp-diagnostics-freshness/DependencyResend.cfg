\* expect: pass
\* module: DependencyAnswer
\* The #4782 re-send as shipped for pyright: the server re-checks the dependent only on its own timer (no republish as it reads the dependency), the phase is undrained (no drain request; the wait starts once the phase wrote its last send), and the phase sends a.ts again after z.ts. The re-send clears a.ts's stored answer and moves its version, and a versioned server's older answer is dropped as superseded, so a settled read was computed against z.ts's new bytes.
CONSTANTS
    PendingGuard = TRUE
    Republish = FALSE
    MaxPubs = 3
    MaxClears = 1
    Resend = TRUE
    Versioned = TRUE
    Drain = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS NewestAtSettle NoPhantomFinding SettleNeedsAnswer NoDroppedAnswer NoCanceledStored
CHECK_DEADLOCK FALSE
