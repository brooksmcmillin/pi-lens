\* expect: violated SettleNeedsAnswer
\* module: DependencyAnswer
\* The answer guard dropped from the quiet window (#4785 F4): a clear empties the stored answer while the window is armed, and the window then resolves the wait on the emptied cache. The touch reads "no answer" only from a wait that ran to its budget, so this early resolve is a phantom clean. The guard is the `answerStored` check in clientWaitForDiagnostics (clients/lsp/client.ts).
CONSTANTS
    PendingGuard = TRUE
    Republish = TRUE
    MaxPubs = 3
    MaxClears = 1
    Resend = FALSE
    Versioned = FALSE
    Drain = TRUE
    Mutant = "noAnswerGuard"
SPECIFICATION Spec
INVARIANTS SettleNeedsAnswer
CHECK_DEADLOCK FALSE
