\* expect: violated NoMissedTeardown
\* module: LastMemberOwnership
\* #4704 mutation: a member pi invalidated without a shutdown still counts as
\* live. pi's AgentSession.dispose() emits no session_shutdown, so once T's
\* runner disposes it, M's leave finds T "live" and skips the teardown, and
\* no later callback releases the registration (the #472 leak). StaleMemberHolds =
\* FALSE is as-built: hasLiveSessionInProcess skips a context that probes stale.
SPECIFICATION Spec
CONSTANTS
    ProcessWideLast = TRUE
    StaleMemberHolds = TRUE
    UnmatchedLeaveIsLast = FALSE
    SplitRelease = TRUE
    StartKeepsLiveFleet = TRUE
    UnbindAtLeave = TRUE
    DisposalUnbinds = TRUE
    SweepAtStart = TRUE
INVARIANTS NoMissedTeardown
CHECK_DEADLOCK FALSE
