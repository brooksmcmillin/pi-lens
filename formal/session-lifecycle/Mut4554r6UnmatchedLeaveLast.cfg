\* expect: violated NoEarlyTeardown
\* module: LastMemberOwnership
\* Pre-fix #4554 r6 (Greptile F1): the superseded primary's DELAYED shutdown is
\* unmatched (the replacement's full admission retired its record), yet the
\* leave read as the activation's last one, so the shared LSP fleet and the
\* registry entry were torn down under the live replacement. UnmatchedLeaveIsLast
\* = FALSE is the fix: last means no live member remains.
SPECIFICATION Spec
CONSTANTS
    ProcessWideLast = TRUE
    StaleMemberHolds = FALSE
    UnmatchedLeaveIsLast = TRUE
    SplitRelease = TRUE
    StartKeepsLiveFleet = TRUE
    UnbindAtLeave = TRUE
    DisposalUnbinds = TRUE
    SweepAtStart = TRUE
INVARIANTS NoEarlyTeardown NoForeignTeardown
CHECK_DEADLOCK FALSE
