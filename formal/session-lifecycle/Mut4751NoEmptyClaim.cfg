\* expect: violated NoStrandedWrite
\* module: TurnStateOwner
\* The claim without its empty arm: P's turn_start finds the envelope
\* ownerless and leaves it; a subagent that leaves before any turn clears it
\* as its own and stamps its id, and P's next write in that turn resolves as
\* a secondary's.
SPECIFICATION Spec
CONSTANTS
    PrimaryClaims = TRUE
    ClaimEmpty = FALSE
    SecondaryClaims = FALSE
    WithSubagent = TRUE
INVARIANTS NoStrandedWrite
CHECK_DEADLOCK FALSE
