\* expect: violated NoEarlyTeardown
\* module: LastMemberOwnership
\* Pre-fix #4704: "last" was read within the leaving activation. pi 1.3.0 runs
\* the factory once per session load, so M's subagent T is its own activation
\* C; M's leave found A empty and tore the registry entry, the registration
\* and the LSP fleet down while T was live. ProcessWideLast = TRUE is the fix.
SPECIFICATION Spec
CONSTANTS
    ProcessWideLast = FALSE
    StaleMemberHolds = FALSE
    UnmatchedLeaveIsLast = FALSE
    SplitRelease = TRUE
    StartKeepsLiveFleet = TRUE
    UnbindAtLeave = TRUE
    DisposalUnbinds = TRUE
    SweepAtStart = TRUE
INVARIANTS NoEarlyTeardown
CHECK_DEADLOCK FALSE
