\* expect: violated NoDeclinedSuccessor
\* module: LastMemberOwnership
\* #4708 round 1 (review F1): one boundary released the registration and tore
\* the shared infra down, the process's last live leave. M left while its
\* subagent T lived, so M's dead registration stayed held, and root identity
\* (#2129) declined M's successor in another root (a cross-root `/resume`) as
\* secondary-root for its whole life. SplitRelease = TRUE is the fix: the
\* holder's own leave releases the registration.
SPECIFICATION Spec
CONSTANTS
    ProcessWideLast = TRUE
    StaleMemberHolds = FALSE
    UnmatchedLeaveIsLast = FALSE
    SplitRelease = FALSE
    StartKeepsLiveFleet = TRUE
    UnbindAtLeave = TRUE
    DisposalUnbinds = TRUE
    SweepAtStart = TRUE
INVARIANTS NoDeclinedSuccessor
CHECK_DEADLOCK FALSE
