\* expect: violated NoStrandedWrite
\* module: TurnStateOwner
\* Pre-fix #4751: no claim. P1's envelope keeps P1 as owner after P1 leaves,
\* so its in-process successor P2 (pi's newSession) resolves as a secondary
\* and files its write under a partition P2's turn end never reads. No
\* subagent, so the violation is the newSession path alone.
SPECIFICATION Spec
CONSTANTS
    PrimaryClaims = FALSE
    ClaimEmpty = TRUE
    SecondaryClaims = FALSE
    WithSubagent = FALSE
INVARIANTS NoStrandedWrite
CHECK_DEADLOCK FALSE
