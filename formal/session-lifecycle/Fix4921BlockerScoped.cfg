\* expect: pass
\* module: SessionLifecycle
\* Shipped #4921: an inline-blocker record carries its producing session and a turn_end delivers only its own (the blocker kind of SecondaryTurnEndScoped, at the SecondaryTurnEnd bound; with /new and /reload the state space passed 6.4M distinct states unfinished).
CONSTANTS
    Transitions = {"SecStart","TurnWork","TurnEnd","SecTurnEnd"}
    Writers = {}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope","namedSuccessor","nameAtShutdown","turnEndScoped","blockerStore","blockerScoped"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 0
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK SecondaryIsolation NoCrossSessionState
CHECK_DEADLOCK FALSE
