\* expect: pass
\* module: SessionLifecycle
\* Merged master (S1-S3, #3757, #3668): the merged tables and every mechanism; a subagent's turn state is its own since #3613 and its read guard since #4942 (MergedSec), so its read lands in its own cell (F4, the half of #3613 that stayed open until #4942). Violated NoCrossSessionState (257 states) before #4942.
CONSTANTS
    Transitions = {"New","Resume","Fork","Clone","CancelFork","Reload","Quit","PiFork","Tree","IdleReset","SecStart","SecEnd","SecTurn","Dup"}
    Writers = {"read","secRead"}
    FixParts = {"entryCapture","handoffAtShutdown","consumeOnMatch","processOrderTurn","dedupe","recordDrop","advisoryScope"}
    FileLess = {}
    MaxSteps = 2
    MaxTurns = 1
    LateHandlers = TRUE
    ForwardExpiredUnstarted = TRUE
    TeardownAtLastMember = TRUE
    Policy <- TargetPolicy
    Fence <- TargetFence
    SecPolicy <- MergedSec
SPECIFICATION Spec
INVARIANTS TypeOK NoCrossSessionState NoStaleBranchWrite NoLostCarry NoUnrecordedFalseBlock NoOwnDrop SecondaryIsolation HandoffOnce NoCrossSessionAdoption OrderMonotone OneResetPerScope NoForeignFact NoEarlyTeardown
CHECK_DEADLOCK FALSE
