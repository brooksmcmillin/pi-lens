\* expect: violated NoEarlyTeardown
\* module: LastMemberOwnership
\* #4708 mutation: once M's leave releases its registration while T lives, M's
\* successor R runs a full start, and that start's LSP reset kills the fleet T
\* still drives. StartKeepsLiveFleet = TRUE is as-built: a full start keeps
\* the fleet while another session in the process is live (keepSharedLsp).
SPECIFICATION Spec
CONSTANTS
    ProcessWideLast = TRUE
    StaleMemberHolds = FALSE
    UnmatchedLeaveIsLast = FALSE
    SplitRelease = TRUE
    StartKeepsLiveFleet = FALSE
    UnbindAtLeave = TRUE
    DisposalUnbinds = TRUE
    SweepAtStart = TRUE
INVARIANTS NoEarlyTeardown
CHECK_DEADLOCK FALSE
