\* expect: violated HeldFreshWhenQuiet
\* module: HeadMoveResync
\* Residual, as built: a move before the session's first look is recorded as
\* the first HEAD, not a move, so documents opened before it stay stale until
\* the drift heartbeat (named in the #4493 PR residuals).
CONSTANTS
    Track = TRUE
    Keying = "session"
    Compare = TRUE
    CurrentOnly = TRUE
    ReportDeferred = TRUE
    InitRec = FALSE
    Serial = TRUE
    Cap = 2
    MaxMoves = 2
    Outside = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK HeldFreshWhenQuiet
CHECK_DEADLOCK FALSE
