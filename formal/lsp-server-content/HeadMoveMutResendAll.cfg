\* expect: violated NoRedundantSend
\* module: HeadMoveResync
\* Mutation: every held document in the delta is resent, so a commit (a
\* move that leaves the bytes) resends what the server already holds.
CONSTANTS
    Track = TRUE
    Keying = "session"
    Compare = TRUE
    CurrentOnly = FALSE
    ReportDeferred = TRUE
    InitRec = TRUE
    Serial = TRUE
    Cap = 2
    MaxMoves = 2
    Outside = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoRedundantSend
CHECK_DEADLOCK FALSE
