\* expect: pass
\* module: BashWriteOrder
\* The fix (#4507, #4528 r1 F1): the written held documents reach the primary
\* before the first dispatch, and the loop waits for that phase; only a wedged
\* primary outlasts the wait, and it answers no check.
CONSTANTS
    RequireOrderedDrain = TRUE
    ReplyOrdering = "single-task-ordered"
    WritesPrimaryFirst = TRUE
    DispatchWaitsPhase = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoPhantomFinding SettledFresh
CHECK_DEADLOCK FALSE
