\* expect: pass
\* module: ServerContent
\* #4532 gap 9 round 5, F3 as-built. A saved touch of the bytes the server
\* holds is debounced, so the save it owes goes out as a standalone queue entry
\* (`handleNotifySave` -> `sendDidSaveForHeldDocument`), and that notification
\* FAILS. The recovery is the send's own continuation: `saveDebouncedPush`
\* leaves the save owed and re-queues ONE save, which lands
\* (`SaveRetryOnFailure`). Nothing else would ask again — the skip sent no
\* content, so there is no later push to carry one.
CONSTANTS
    Writes = 0
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 0
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
    ContentGate = "sent"
    MidClose = FALSE
    SkipNeedsIdle = TRUE
    SaveBoundToContent = TRUE
    SavedTouches = TRUE
    OpenFilePushes = FALSE
    Revert = FALSE
    SaveRetryOnFailure = TRUE
    SaveSendFails = 1
    SaveMarkOnLanding = TRUE
SPECIFICATION Spec
INVARIANTS SkippedContentHeld SaveFollowsSavedTouch
CHECK_DEADLOCK FALSE
