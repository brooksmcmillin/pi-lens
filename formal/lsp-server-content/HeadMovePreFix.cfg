\* expect: violated HeldFreshWhenQuiet
\* module: HeadMoveResync
\* The code before #4493: recovery reads only the dirty set, so a clean-tree
\* move (checkout, reset --hard, a completed rebase or cherry-pick, or the
\* same outside pi) is never looked at and the server keeps the old bytes.
CONSTANTS
    Track = FALSE
    Keying = "session"
    Compare = TRUE
    CurrentOnly = TRUE
    ReportDeferred = TRUE
    InitRec = TRUE
    Serial = TRUE
    Cap = 2
    MaxMoves = 2
    Outside = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK HeldFreshWhenQuiet
CHECK_DEADLOCK FALSE
