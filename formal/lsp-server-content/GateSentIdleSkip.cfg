\* expect: pass
\* module: ServerContent
\* #4532 gap 9 round 3, F1 as-built: the same schedule as
\* MutGateSkipDuringSend, under the code's gate. A cascade touch of A is
\* offered while B's send is still queued; the queue is not idle, so the touch
\* pushes and the server ends on the content the last touch named. A skip IS
\* reachable in this config (the cascade checks before B's touch has enqueued),
\* so SkippedContentHeld is not vacuous.
CONSTANTS
    Writes = 2
    Cascade = FALSE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 1
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
    ContentGate = "sent"
    MidClose = FALSE
    SkipNeedsIdle = TRUE
    SaveBoundToContent = TRUE
    SavedTouches = FALSE
    OpenFilePushes = FALSE
    Revert = TRUE
    SaveRetryOnFailure = TRUE
    SaveSendFails = 0
    SaveMarkOnLanding = TRUE
SPECIFICATION Spec
INVARIANTS SendsMonotone SkippedContentHeld SaveFollowsSavedTouch
CHECK_DEADLOCK FALSE
