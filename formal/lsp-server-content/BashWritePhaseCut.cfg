\* expect: violated NoPhantomFinding
\* module: BashWriteOrder
\* #4528 r1: a 500 ms bound could end the wait while the phase still sent, so
\* the dependent was checked before the dependency's new bytes were sent.
CONSTANTS
    RequireOrderedDrain = TRUE
    ReplyOrdering = "single-task-ordered"
    WritesPrimaryFirst = TRUE
    DispatchWaitsPhase = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoPhantomFinding SettledFresh
CHECK_DEADLOCK FALSE
