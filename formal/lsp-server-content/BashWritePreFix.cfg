\* expect: violated NoPhantomFinding
\* module: BashWriteOrder
\* Before #4507: each file reached the primary in its own dispatch, so the
\* dependent dispatched first was checked against the dependency's old bytes.
CONSTANTS
    RequireOrderedDrain = TRUE
    ReplyOrdering = "single-task-ordered"
    WritesPrimaryFirst = FALSE
    DispatchWaitsPhase = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoPhantomFinding SettledFresh
CHECK_DEADLOCK FALSE
