\* expect: violated OneRowPerEvent
\* module: HeadMoveResync
\* Mutation: looks of one session run concurrently. Two read HEAD on either
\* side of a move and set the record in the other order, so a later look
\* reports the same move again.
CONSTANTS
    Track = TRUE
    Keying = "session"
    Compare = TRUE
    CurrentOnly = TRUE
    ReportDeferred = TRUE
    InitRec = TRUE
    Serial = FALSE
    Cap = 2
    MaxMoves = 2
    Outside = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneRowPerEvent
CHECK_DEADLOCK FALSE
