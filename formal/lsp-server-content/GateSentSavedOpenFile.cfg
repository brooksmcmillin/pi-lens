\* expect: pass
\* module: ServerContent
\* #4532 gap 9 round 3, F2 as-built. A saved touch lands A (its save rides the
\* push and `savedHash` names A); `openFile` then pushes C for a resync without
\* marking a touch, so the record moves to C while the mark still says A; the
\* saved touch of C is debounced and must still send its save, bound to C.
\*
\* ServerMatchesDisk is deliberately NOT listed. With these scenario constants
\* the model can now express the read-to-touch gap `recordFullyCoveredSync`
\* (clients/lsp/index.ts) documents as a known narrowing: a touch that read B
\* starts AFTER disk moved to C, so its own start-time stamp hides the stale
\* send from the drift sweep. That hazard exists in code this PR does not
\* change, and it reds on the as-built gate too; it is recorded as a residual,
\* not pinned as a pass.
CONSTANTS
    Writes = 2
    Cascade = TRUE
    EqualLength = TRUE
    LossyFp = FALSE
    Debounce = TRUE
    RecentA = TRUE
    MidSweeps = 0
    PriorInFlight = FALSE
    FifoLanding = TRUE
    SweepKey = "both"
    FixCoalesce = TRUE
    FixDrop = TRUE
    ContentGate = "sent"
    MidClose = FALSE
    SkipNeedsIdle = TRUE
    SaveBoundToContent = TRUE
    SavedTouches = TRUE
    OpenFilePushes = TRUE
    Revert = FALSE
    SaveRetryOnFailure = TRUE
    SaveSendFails = 0
    SaveMarkOnLanding = TRUE
SPECIFICATION Spec
INVARIANTS SendsMonotone SkippedContentHeld SaveFollowsSavedTouch
CHECK_DEADLOCK FALSE
