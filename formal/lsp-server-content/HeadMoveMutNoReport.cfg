\* expect: violated HeldFreshWhenQuiet
\* module: HeadMoveResync
\* Mutation: the row omits the drain cap's remainder, so a capped hop leaves
\* held documents stale with nothing saying so.
CONSTANTS
    Track = TRUE
    Keying = "session"
    Compare = TRUE
    CurrentOnly = TRUE
    ReportDeferred = FALSE
    InitRec = TRUE
    Serial = TRUE
    Cap = 1
    MaxMoves = 2
    Outside = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK HeldFreshWhenQuiet
CHECK_DEADLOCK FALSE
