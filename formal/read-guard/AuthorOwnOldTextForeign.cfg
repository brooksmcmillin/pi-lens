\* expect: pass
\* module: ReadGuard
\* #4387 keeps #4210's fail-closed direction across a move (review r1 F1, S3): bash, the
\* own oldText edit, another writer, a second own oldText edit through the read path, which
\* advances the authorship over that writer's line, then a turn and a /tree to the leaf. The
\* first edit's injected read names the authorship's write, so the move keeps it, and the
\* positional edit of the other writer's line is refused.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 4
    Ops = {"bash","oedit","edit"}
    Spans = {1}
    ExtWrites = 1
    ExtKinds = {"replace"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {"turn","tree"}
    MaxBounds = 2
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow NoIdlessAuthoredRead
CHECK_DEADLOCK FALSE
