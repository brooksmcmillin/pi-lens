\* expect: pass
\* module: ReadGuard
\* #4387 round 2 (S12): with only a bridge read, which names no tool call, the zero-read arm
\* never runs, so nothing records a read a move keeps. The own oldText edit's credit then
\* leaves an empty scope instead of advancing, and after the move the line another writer
\* landed during the edit is refused.
