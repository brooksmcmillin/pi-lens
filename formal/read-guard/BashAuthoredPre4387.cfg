\* expect: violated NoFalseBlock
\* module: ReadGuard
\* #4387 (sibling, from #4235 / 55fa5210c): BashAuthored with the code that dropped the
\* zero-read injection for every authorship. bash, an own positional edit of line 1 the
\* authorship allows, then an edit of another line: the own edit's read now shadows the
\* authorship and the exact edit is refused. The code since #4387 injects again over a
\* whole-file authorship, so BashAuthored.cfg passes.
CONSTANTS
    N0 = 3
    MaxLen = 4
    AgentOps = 3
    Ops = {"bash","edit"}
    Spans = {1}
    ExtWrites = 0
    ExtKinds = {"replace","delete","insert"}
    ExtPhases = {"idle"}
    FixKind = "none"
    FormatDrain = "none"
    Bounds = {}
    MaxBounds = 0
    Hashes = TRUE
    Ctx = 0
    HandlerEvidence = FALSE
    CreationHandlerEvidence = FALSE
    MtimeAuthored = FALSE
    OwnEditRescue = FALSE
    ForkImport = FALSE
    SuppressByNewerContext = TRUE
    FormatStamp = FALSE
    ProvisionalCredit = FALSE
    RevokeFailedRead = TRUE
    BlockRelease = "end"
    RecordAuthoritative = TRUE
    RecordOwnEdit = TRUE
    OwnEditSkipsReloc = TRUE
    SpanSnapshot = TRUE
    RelocFromLatest = TRUE
    WholeVouchesPastEnd = FALSE
    ForkAtBoundary = FALSE
    BranchFilter = TRUE
    DrainMode = "atomic"
    FileTimeCheck = TRUE
    CoverageCheck = TRUE
    SnapshotCheck = TRUE
    AuthorIdentity = TRUE
    RetireAtWrite = TRUE
    AuthorBranch = TRUE
    BridgeNoAdvance = TRUE
    ZeroReadInjects <- ZeroReadInjectsPre4387
SPECIFICATION Spec
INVARIANTS NoStaleAllow NoBlindAllow NoFalseBlock
CHECK_DEADLOCK FALSE
