\* expect: pass
\* module: OpaqueBaselineSlot
\* The fix on S8: one key per tool-call id, the dedupe ranked by authority,
\* dead-turn entries retired. Three parallel calls all keep authorship and
\* their blocker records, and nothing is dropped. Root "one" is #4504: both
\* hooks name the session's own root, so every call finds its own baseline.
CONSTANTS
    Keying = "call"
    Root = "one"
    Cap = 3
    Subtract = FALSE
    Dedupe = "authority"
    Retire = TRUE
    Observe = "counted"
    Sequential = FALSE
    LatchClear = FALSE
    ClearRule = "bytes"
    Scenario = "s8"
SPECIFICATION Spec
INVARIANTS TypeOK EveryWriteAttributed EveryCallFindsItsBaseline BlockerKept NoDrop SlotLossObservable StaleRetired RetiresOnlyAbandoned StaleRecordCleared
CHECK_DEADLOCK FALSE
