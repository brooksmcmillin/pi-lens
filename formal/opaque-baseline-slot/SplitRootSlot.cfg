\* expect: violated EveryCallFindsItsBaseline
\* module: OpaqueBaselineSlot
\* #4504, the pre-fix code with the per-call keying in place: Keying "call"
\* keeps one entry per tool-call id, but the two hooks resolve DIFFERENT
\* roots, so the entry an owner records is under a key its own take never
\* names. Every call therefore takes no baseline and reports
\* no-pending-snapshot for a command that did write — the shape a concurrent
\* secondary session (#473) hit in a linked worktree, whose ctx.cwd is its own
\* tree while the shared coordinator keeps the live primary's projectRoot.
\* Nothing is overwritten or evicted, so the loss is uncounted: the only
\* evidence is the miss itself (SlotLossObservable, which the as-built
\* configs list, is violated here too and is deliberately not listed).
CONSTANTS
    Keying = "call"
    Root = "split"
    Cap = 3
    Subtract = FALSE
    Dedupe = "authority"
    Retire = TRUE
    Observe = "counted"
    Sequential = FALSE
    LatchClear = FALSE
    ClearRule = "bytes"
    Scenario = "s8"
SPECIFICATION Spec
INVARIANTS TypeOK EveryCallFindsItsBaseline
CHECK_DEADLOCK FALSE
