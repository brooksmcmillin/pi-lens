\* expect: pass
\* module: InstanceReaper
\* #3986: a backstop that tracks none of the other instance's children (a
\* sweep from another PI_LENS_HOME, whose registry is not the owner's), on
\* POSIX where a child whose launcher exited has a live ppid that names
\* neither owner. FixSafety without the "tracked" guard: the owner tag alone
\* keeps every live instance's child safe, so the machine-wide sweep needs no
\* home check.
CONSTANTS
    Pids = {0, 1, 2, 3}
    Insts = {A, B}
    Mcp = {}
    Crashable = {A, B}
    NoKids = {}
    MaxBirth = 4
    Reapers = {r1}
    Backstops = {b1}
    Posix = TRUE
    PidReuse = TRUE
    OtherProcs = TRUE
    RecCmd = "node"
    LateRecord = TRUE
    FootprintPrune = TRUE
    ScanFail = FALSE
    StalePrune = FALSE
    Guards = {"parentDead", "identity", "ppid", "lock"}
    FixParts = {"birth", "recheck", "tag"}
SPECIFICATION Spec
INVARIANTS TypeOK NoWrongKill
CHECK_DEADLOCK FALSE
