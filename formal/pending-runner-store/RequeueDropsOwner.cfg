\* expect: violated NoStaleAdmission
\* module: RunnerStore
\* Mutant: settledSnapshot loses entry.session, so the requeued answer
\* re-enters unfenced and a later retirement cannot reject it.
CONSTANTS
    Slots = {1, 2}
    Peek = "owned"
    Drain = "owned"
    Requeue = "drop"
    NoHandle = "admit"
SPECIFICATION Spec
INVARIANTS TypeOK NoStaleAdmission NoDropFreshAnswer
CHECK_DEADLOCK FALSE
