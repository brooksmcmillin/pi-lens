\* expect: violated NoCleanAfterDemotion
\* module: StoreRetire
\* Mutant (the code before #4625, #4620): the stale sweep deletes the record and nobody is told, so the very read that ran the sweep answers clean.
CONSTANTS
    Writes = 2
    SizeMode = "any"
    MaxTime = 6
    Tol = 2
    Gran = 1
    Skew = 1
    MinReadDelay = 0
    Stamp = "start"
    Gate = "mtime"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = FALSE
    ServerLag = FALSE
    Retire = "drop"
SPECIFICATION RetireSpec
INVARIANTS NoCleanAfterDemotion
CHECK_DEADLOCK FALSE
