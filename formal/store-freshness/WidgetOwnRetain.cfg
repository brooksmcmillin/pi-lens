\* expect: pass
\* module: StoreRetire
\* The code (#4625): reconcileStaleWidgetFiles keeps a record whose findings it shed as unfinished evidence (the final flag cleared, the surviving findings recounted, touchedAt held at the file's mtime), so a second read, a read after the footer's observer-less sweep and a read of a pruned record all still find it. A missing file still drops; X is only ever written here, so the model does not reach that branch. Was violated twice: MutWidgetOwnDropOnce (586dd00fd) and MutWidgetOwnDrop (the code before #4625). The gate constants are WidgetOwnLateStamp's.
CONSTANTS
    Writes = 2
    SizeMode = "any"
    MaxTime = 6
    Tol = 2
    Gran = 1
    Skew = 1
    MinReadDelay = 0
    Stamp = "start"
    Gate = "mtime"
    ForceHash = FALSE
    SizeOnly = FALSE
    StatAt = "before"
    SizeKey = TRUE
    Binding = FALSE
    BindingAt = "read"
    MaxServes = 2
    Latch = FALSE
    AllowRegress = FALSE
    ServerLag = FALSE
    Retire = "retain"
SPECIFICATION RetireSpec
INVARIANTS NoCleanAfterDemotion NoStaleServeBeyondTol
CHECK_DEADLOCK FALSE
