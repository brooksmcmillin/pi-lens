name: PR metadata

# Title and close-keyword checks read live PR metadata and rerun on edits.
# This fork does not run a PR-body structure gate.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

# An edit must not cancel checks for the pushed head.
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && '-edited' || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Run both validations even if one fails.
  pr-metadata:
    name: PR metadata
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Close-keyword parsing imports the shared Markdown lexer even without
      # the optional body lint. Install only its integrity-pinned dependency.
      - name: Install marked (version and integrity pinned by the lockfile)
        run: |
          set -eu
          version=$(node -p "require('./package.json').devDependencies.marked")
          locked=$(node -p "require('./package-lock.json').packages['node_modules/marked'].version")
          integrity=$(node -p "require('./package-lock.json').packages['node_modules/marked'].integrity")
          test "$version" = "$locked"
          tarball=$(npm pack --silent --ignore-scripts "marked@${version}" --pack-destination "$RUNNER_TEMP")
          actual="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$tarball" | base64 -w0)"
          test "$actual" = "$integrity"
          mkdir -p node_modules/marked
          tar -xzf "$RUNNER_TEMP/$tarball" -C node_modules/marked --strip-components=1

      - name: Validate PR title (conventional prefix)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-title.mjs

      - name: Validate per-issue close keywords
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-close-keywords.mjs --lint-pr
