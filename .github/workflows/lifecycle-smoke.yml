name: D9 hook CPU and stdin profile (diagnostic only)

# Manual-only throwaway branch. Never merge this adaptation.
# Keep dormant job definitions so the workflow job census is unchanged.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Lane 1 (#1605): real-host PSScriptAnalyzer -File classification.
  # Windows-only — the defect (#1540/#1604) is a PowerShell execution-policy
  # stderr-parsing question that only a real Windows host can answer.
  psscriptanalyzer-classification:
    if: ${{ false }}
    name: Lane 1 — PSScriptAnalyzer real-host classification
    runs-on: windows-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs: 263s (4m23s); sized at
    # ~2x + margin.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # --ignore-scripts is safe here (unlike install-smoke.yml's tarball-pack
      # case, S6505's noted exception): this job runs `npm run build:dist`
      # itself as an explicit next step and never needs the `prepare` script's
      # grammar download. `npm ci` (not `npm install`) locks to package-lock.json
      # (S8543).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build dist
        run: npm run build:dist
      # F1: both interpreters need the module installed SEPARATELY -- pwsh and
      # Windows PowerShell 5.1 resolve `Install-Module`'s CurrentUser scope
      # under different module paths, so one interpreter having the module
      # says nothing about the other. The script's own preflight fails
      # distinctly (INFRA) if either is missing, but installing it here is
      # what keeps the lane meaningful instead of exiting 2 every run.
      - name: Install PSScriptAnalyzer module (pwsh)
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Confirm:$false
      - name: Install PSScriptAnalyzer module (Windows PowerShell 5.1)
        shell: powershell
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Confirm:$false
      # F3: one-line toggle for #1604 -- flip to `expected-fail` if the pwsh
      # leg reds by reproducing ConciseView's stderr evasion, so the nightly
      # doesn't stay permanently red while #1604 is open. See the script's own
      # header comment for the full contract.
      - name: Real-host classification smoke (pwsh + powershell legs)
        env:
          PI_LENS_SMOKE_PSA_PWSH_MODE: required
        run: node scripts/smoke-psscriptanalyzer-classification.mjs

  # Reuse the existing Ubuntu job; the other two definitions never execute.
  availability-lifecycle:
    name: D9 — one range-matched inactive guard profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOME: ${{ github.workspace }}/.probe-home
      PI_LENS_HOME: ${{ github.workspace }}/.probe-home
      PILENS_DATA_DIR: ${{ github.workspace }}/.probe-home/data
      PI_LENS_TEST_MAX_WORKERS: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create private probe directories
        run: |
          mkdir -p "$HOME" "$PILENS_DATA_DIR" "$RUNNER_TEMP/pr24-hook-profile-tmp"
          printf 'TMPDIR=%s/pr24-hook-profile-tmp\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.3"
      - name: Install locked dependencies without lifecycle scripts
        run: timeout --signal=KILL 300s npm ci --no-audit --no-fund --ignore-scripts
      - name: Check focused diagnostic harness (no hook process)
        run: timeout --signal=KILL 60s env -u PI_LENS_HOME -u PILENS_DATA_DIR node --test tests/scripts/pr24-hook-profile.test.mjs
      - name: Profile exactly one real 9 MB hook child
        # 180s child cap < 240s driver cap < 20m job cap. The original
        # 60000ms test deadline is neither executed nor changed here.
        run: |
          mkdir -p .probe-home/pr24-hook-profile
          set +e
          /usr/bin/time -v -o .probe-home/pr24-hook-profile/driver-time.txt \
            timeout --signal=KILL 240s node scripts/diagnostics/pr24-hook-profile.mjs --measure \
            > .probe-home/pr24-hook-profile/driver.stdout 2> .probe-home/pr24-hook-profile/driver.stderr
          status=$?
          printf '{"exit":%s}\n' "$status" > .probe-home/pr24-hook-profile/driver-exit.json
          cat .probe-home/pr24-hook-profile/driver.stdout .probe-home/pr24-hook-profile/driver.stderr
          exit "$status"
      - name: Retain profile and bounded failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr24-d9-hook-profile
          path: .probe-home/pr24-hook-profile/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Lane 4 (#1605): exclusion scope — would have caught #1562/#1574. Real
  # gitleaks binary over a real fixture repo with a planted secret in a
  # tracked file and another under a gitignored secrets-lane scratch dir.
  gitleaks-scratch-exclusion:
    if: ${{ false }}
    name: Lane 4 — gitleaks exclusion scope (tracked visible, scratch demoted)
    runs-on: ubuntu-latest
    # refs #3123: bounds a hang against GitHub's 360-min default.
    # Measured max over last 10 successful master runs: 30s; timeout = floor of
    # 10 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # --ignore-scripts is safe here (unlike install-smoke.yml's tarball-pack
      # case, S6505's noted exception): this job runs `npm run build:dist`
      # itself as an explicit next step and never needs the `prepare` script's
      # grammar download. `npm ci` (not `npm install`) locks to package-lock.json
      # (S8543).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Build dist
        run: npm run build:dist
      # Pinned deliberately (bump by hand after checking
      # https://github.com/gitleaks/gitleaks/releases and recomputing the
      # sha256 below — see #731): avoids an unpinned, unverified binary
      # download in a job that scans real (if fixture) directory trees.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -uxo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Exclusion-scope smoke (real gitleaks, fixture repo)
        run: node scripts/smoke-gitleaks-scratch-exclusion.mjs
